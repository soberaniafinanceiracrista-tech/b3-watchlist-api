# ==========================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================
spring.application.name=b3-watchlist-api
server.port=8080
server.port=${PORT:8080}

# Garante que logs e agendamentos (@Scheduled) sigam o horário de Brasília
spring.jackson.time-zone=America/Sao_Paulo

# ==========================================
# BANCO DE DADOS (POSTGRESQL / SUPABASE)
# ==========================================
# Use a URL do Connection Pooler do Supabase (host ...pooler.supabase.com)
# Exemplo do valor da variável SUPABASE_JDBC_URL:
# jdbc:postgresql://://supabase.com
spring.datasource.url=${SUPABASE_JDBC_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP) ajustado para não estourar o limite do plano gratuito do Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==========================================
# JPA / HIBERNATE
# ==========================================
# Valida se as entidades Java batem com as tabelas que você criou no SQL Editor
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=watchlist
spring.jpa.open-in-view=false

# Mude para true apenas se quiser ver as queries SQL no console durante o desenvolvimento
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# INTEGRAÇÃO EXTERNA (BRAPI.DEV)
# ==========================================
brapi.token=${BRAPI_TOKEN}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
