<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3 Watchlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            max-width: 820px;
            margin: 30px auto;
            padding: 0 16px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 16px; }
        .card {
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input {
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 0.95rem;
            flex: 1;
            min-width: 180px;
        }
        button {
            padding: 10px 18px;
            background-color: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #9aa0a6; cursor: wait; }
        .btn-sec { background-color: #f1f3f4; color: #3c4043; }
        .btn-sec:hover { background-color: #e8eaed; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
        }
        th { color: #5f6368; font-size: 0.85rem; font-weight: 600; }
        .ticker { font-weight: 700; font-size: 1rem; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .alta { background-color: #e6f4ea; color: #137333; }
        .baixa { background-color: #fce8e6; color: #c5221f; }
        .neutro { background-color: #f1f3f4; color: #5f6368; }
        .historico-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .tag {
            background: #e8f0fe;
            color: #1967d2;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }
        .tag:hover { background: #d2e3fc; }
        .btn-del {
            background: none;
            color: #80868b;
            padding: 4px 8px;
            font-size: 0.85rem;
        }
        .btn-del:hover { color: #c5221f; background: none; }
        .info-text { font-size: 0.85rem; color: #5f6368; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>📈 B3 Watchlist</h1>

    <div class="card">
        <div class="form-row">
            <input type="text" id="tickersInput" placeholder="Tickers (ex: PETR4, VALE3, BOVV11)" />
            <input type="email" id="emailInput" placeholder="E-mail (opcional - salva carteira)" />
            <button id="btnConsultar" onclick="consultar()">Consultar</button>
            <button class="btn-sec" onclick="carregarCarteira()">Carregar E-mail</button>
        </div>
        <div class="info-text">
            Sem e-mail: consulta avulsa na hora. Com e-mail: salva na sua carteira no Supabase.
        </div>

        <div id="historicoContainer" style="margin-top: 14px; display: none;">
            <strong style="font-size: 0.85rem; color: #5f6368;">Histórico da sessão:</strong>
            <div class="historico-tags" id="historicoTags"></div>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Ativo</th>
                    <th>Cotação</th>
                    <th>Variação Dia</th>
                    <th>Atualizado em</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <tr><td colspan="5" style="color: #5f6368;">Digite um ou mais tickers acima para consultar.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Guarda o histórico apenas enquanto a aba/sessão estiver aberta
        let historicoSessao = JSON.parse(sessionStorage.getItem('historicoTickers') || '[]');
        renderizarHistorico();

        // Permite apertar Enter nos campos
        document.getElementById('tickersInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') consultar();
        });

        async function consultar(tickerClicado = null) {
            const tickersField = document.getElementById('tickersInput');
            const email = document.getElementById('emailInput').value.trim();
            const tickers = tickerClicado || tickersField.value.trim();

            if (!tickers) {
                alert('Informe ao menos um ticker.');
                return;
            }

            registrarNoHistorico(tickers);

            const btn = document.getElementById('btnConsultar');
            btn.disabled = true;
            btn.innerText = 'Buscando...';

            try {
                const resp = await fetch('/api/carteira/ativos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email || null, tickers: tickers })
                });

                if (!resp.ok) throw new Error('Erro ao consultar');
                const dados = await resp.json();
                renderizarTabela(dados, Boolean(email));
                if (!tickerClicado) tickersField.value = '';
            } catch (err) {
                alert('Erro ao buscar cotações: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Consultar';
            }
        }

        async function carregarCarteira() {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) {
                alert('Informe seu e-mail para carregar a carteira salva.');
                return;
            }
            const resp = await fetch(`/api/carteira?email=${encodeURIComponent(email)}`);
            const dados = await resp.json();
            renderizarTabela(dados, true);
        }

        async function removerAtivo(ticker) {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) return;
            await fetch(`/api/carteira/ativos/${ticker}?email=${encodeURIComponent(email)}`, {
                method: 'DELETE'
            });
            carregarCarteira();
        }

        function registrarNoHistorico(tickersTexto) {
            const novos = tickersTexto.split(',')
                .map(t => t.trim().toUpperCase())
                .filter(t => t.length > 0);

            novos.forEach(t => {
                if (!historicoSessao.includes(t)) {
                    historicoSessao.unshift(t);
                }
            });
            sessionStorage.setItem('historicoTickers', JSON.stringify(historicoSessao));
            renderizarHistorico();
        }

        function renderizarHistorico() {
            const container = document.getElementById('historicoContainer');
            const tagsDiv = document.getElementById('historicoTags');
            if (historicoSessao.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            tagsDiv.innerHTML = historicoSessao
                .map(t => `<span class="tag" onclick="consultar('${t}')">${t}</span>`)
                .join('');
        }

        function renderizarTabela(ativos, permiteExcluir) {
            const tbody = document.getElementById('tabelaCorpo');
            if (!ativos || ativos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: #5f6368;">Nenhum ativo encontrado.</td></tr>';
                return;
            }

            tbody.innerHTML = ativos.map(a => {
                const preco = a.precoAtual != null
                    ? `R$ ${Number(a.precoAtual).toFixed(2).replace('.', ',')}`
                    : '<span style="color:#9aa0a6">N/D</span>';

                let varHtml = '<span class="badge neutro">N/D</span>';
                if (a.variacaoDia != null) {
                    const v = Number(a.variacaoDia);
                    const classe = v > 0 ? 'alta' : (v < 0 ? 'baixa' : 'neutro');
                    const sinal = v > 0 ? '+' : '';
                    varHtml = `<span class="badge ${classe}">${sinal}${v.toFixed(2).replace('.', ',')}%</span>`;
                }

                const dataHora = a.atualizadoEm
                    ? new Date(a.atualizadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                    : '-';

                const acao = permiteExcluir
                    ? `<button class="btn-del" title="Remover da carteira" onclick="removerAtivo('${a.ticker}')">✕</button>`
                    : '';

                return `
                    <tr>
                        <td class="ticker">${a.ticker}</td>
                        <td>${preco}</td>
                        <td>${varHtml}</td>
                        <td style="color:#5f6368; font-size:0.85rem;">${dataHora}</td>
                        <td>${acao}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
