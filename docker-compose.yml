services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b3-watchlist-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SUPABASE_JDBC_URL}
      - SPRING_DATASOURCE_USERNAME=${SUPABASE_USER}
      - SPRING_DATASOURCE_PASSWORD=${SUPABASE_PASSWORD}
      - BRAPI_TOKEN=${BRAPI_TOKEN}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  postgres-local:
    image: postgres:16-alpine
    container_name: b3-watchlist-db-local
    profiles:
      - local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata_local:/var/lib/postgresql/data

volumes:
  pgdata_local:
